name: Synthetic hardened publisher
run-name: Synthetic hardened batch ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        required: true
        type: string
      operations:
        required: true
        type: string
permissions:
  contents: read
  statuses: write
  pull-requests: read
concurrency:
  group: synthetic-hardened-publisher
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Exercise synthetic hardened publisher contracts
        env:
          GH_TOKEN: ${{ github.token }}
          OPERATIONS: ${{ inputs.operations }}
        run: python3 hardened-publisher.py
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-hardened-receipts
          path: hardened-receipts.json
